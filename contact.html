<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Talk with our team — FMC Affiliate</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1C1826;--field:#221d2f;--ink:#fff;--muted:#C3CBD9;--dim:#8892A6;--blue:#3B9DFF;--spark:#F59148;--rule:rgba(255,255,255,.13)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .hero{background:radial-gradient(ellipse 70% 60% at 25% 15%,rgba(59,157,255,.16),transparent 60%),linear-gradient(168deg,#2A2440,#1B1728 60%,#141019);padding:60px 0 44px;border-bottom:1px solid var(--rule);text-align:center}
  .wrap{max-width:600px;margin:0 auto;padding:0 28px}
  h1{font-size:clamp(30px,4.4vw,42px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:14px}
  h1 em{font-style:normal;color:var(--blue)}
  .lede{font-size:17px;color:var(--muted);max-width:460px;margin:0 auto}
  form{padding-top:40px}
  .grp{margin-bottom:22px}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;color:#eef2fa}
  label .req{color:var(--blue)}
  input,textarea{width:100%;background:var(--field);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;color:var(--ink);font-family:inherit;font-size:15.5px;transition:border-color .15s,box-shadow .15s}
  input::placeholder,textarea::placeholder{color:#6c7488}
  input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,157,255,.18)}
  textarea{resize:vertical;min-height:130px}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#0b1220;font-weight:700;font-size:16px;padding:15px 30px;border:0;border-radius:14px;cursor:pointer;margin-top:6px;transition:background .15s}
  .btn:hover{background:#5aacff}
  .btn .ar{position:relative;top:1px}
  #msg{display:none;margin-top:18px;padding:14px 18px;border-radius:12px;font-size:15px}
  #msg.ok{display:block;background:rgba(139,211,74,.12);border:1px solid rgba(139,211,74,.5);color:#cdeeb0}
  #msg.err{display:block;background:rgba(245,120,120,.12);border:1px solid rgba(245,120,120,.5);color:#f4c4c4}
  .site-foot{border-top:1px solid rgba(255,255,255,.1);margin-top:54px}
  .site-foot .wrap{text-align:center;padding:42px 28px}
  .site-foot img{height:34px;opacity:.95}
</style>
</head>
<body>
  <div class="hero"><div class="wrap">
    <h1>Talk with <em>our team</em></h1>
    <p class="lede">Questions about the affiliate program or application process? Leave us a message and we'll get back to you soon.</p>
  </div></div>

  <div class="wrap"><form id="qForm" action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="3ea93c57-b5cf-4894-a1fa-5fbe112a4735">
    <input type="hidden" name="subject" value="FMC Affiliate - Quick Question">
    <input type="hidden" name="from_name" value="FMC Affiliate Page">
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

    <div class="grp"><label>Name <span class="req">*</span></label><input type="text" name="Name" placeholder="Your name" required></div>
    <div class="grp"><label>Email <span class="req">*</span></label><input type="email" name="Email" placeholder="you@company.com" required></div>
    <div class="grp"><label>Your message <span class="req">*</span></label><textarea name="Message" placeholder="What would you like to know?" required></textarea></div>

    <button class="btn" type="submit">Send message <span class="ar">&rarr;</span></button>
    <div id="msg"></div>
  </form></div>

  <footer class="site-foot"><div class="wrap">
    <img src="https://www.fmctraining.com/wp-content/uploads/2025/03/fmc_footer_white.png" alt="FMC">
  </div></footer>

<script>
  const f=document.getElementById('qForm'), msg=document.getElementById('msg');
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const data=new FormData(f); msg.className='';
    try{
      const r=await fetch('https://api.web3forms.com/submit',{method:'POST',body:data,headers:{'Accept':'application/json'}});
      const j=await r.json();
      if(j.success){ msg.className='ok'; msg.textContent='Thanks — your message has been sent. We’ll be in touch shortly.'; f.reset(); }
      else { msg.className='err'; msg.textContent=(j.message||'Something went wrong')+'.'; }
    }catch(err){ msg.className='err'; msg.textContent='Network error — please try again.'; }
  });
</script>
</body>
</html>
